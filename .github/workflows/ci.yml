name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Solid gate: typecheck, unit tests, web export + artifact
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Export web (static)
        run: npm run export:web

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: zakura-bot-web
          path: dist/
          retention-days: 14

  # Optional / soft gate: Playwright against the exported preview
  # (continue-on-error so flaky e2e does not block the unit+export gate)
  web-e2e:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: zakura-bot-web
          path: dist/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Web e2e (Playwright)
        run: npm run test:web
        env:
          CI: true
