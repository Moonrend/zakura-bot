name: Android APK

# Local Gradle APK — no Expo cloud / EXPO_TOKEN required.
# Runs on main pushes (packaging), manual dispatch, and version tags.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # RN native builds for 4 ABIs fill the ~14GB runner disk ("No space left on device").
      # Free space before installing toolchains. Keep Android SDK root; prune unused bits.
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk-bundle || true
          # Drop older platforms/build-tools we will not use (Expo 57 needs API 36).
          sudo rm -rf /usr/local/lib/android/sdk/platforms/android-{29,30,31,32,33,34} || true
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/3* || true
          sudo docker system prune -af || true
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Do NOT install obsolete SDK package "tools" (fails: Failed to find package 'tools').
      # Expo 57 / RN 0.86 defaults: compileSdk 36, build-tools 36.0.0, NDK 27.1.12297006.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools cmdline-tools;latest build-tools;36.0.0 platforms;android-36 ndk;27.1.12297006 cmake;3.22.1

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive

      # Device APK only — skip x86/armeabi-v7a native compiles (disk + time on GHA).
      - name: Limit native ABIs for CI
        run: |
          set -euo pipefail
          PROP=android/gradle.properties
          if grep -q '^reactNativeArchitectures=' "$PROP"; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' "$PROP"
          else
            printf '\nreactNativeArchitectures=arm64-v8a\n' >> "$PROP"
          fi
          grep '^reactNativeArchitectures=' "$PROP"
          which node
          node -v
          df -h

      - name: Assemble APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          GRADLE_ARGS=(assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace)
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Release signing secrets present — assembling release APK."
            mkdir -p keystores
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystores/release.keystore
            {
              echo "MYAPP_UPLOAD_STORE_FILE=../keystores/release.keystore"
              echo "MYAPP_UPLOAD_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
              echo "MYAPP_UPLOAD_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
              echo "MYAPP_UPLOAD_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
            } >> gradle.properties
            if grep -q 'MYAPP_UPLOAD_STORE_FILE' app/build.gradle 2>/dev/null || \
               grep -q 'signingConfigs' app/build.gradle 2>/dev/null; then
              GRADLE_ARGS=(assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace)
            else
              echo "::warning::Release keystore provided but app/build.gradle may not reference MYAPP_* props yet. Falling back to assembleDebug (debug-signed)."
            fi
          else
            echo "No ANDROID_KEYSTORE_* secrets — building debug-signed APK (OK for internal testing)."
          fi
          ./gradlew "${GRADLE_ARGS[@]}"

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find android -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under android/"
            find android -type f -name "*.apk" -o -name "*.aab" || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zakura-bot-android-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
