name: Android APK

# Local Gradle APK — no Expo cloud / EXPO_TOKEN required.
# Runs on main pushes (packaging), manual dispatch, and version tags.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # RN native builds for 4 ABIs fill the ~14GB runner disk ("No space left on device").
      # Free space before installing toolchains. Keep Android SDK root; prune unused bits.
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk-bundle || true
          # Drop older platforms/build-tools we will not use (Expo 57 needs API 36).
          sudo rm -rf /usr/local/lib/android/sdk/platforms/android-{29,30,31,32,33,34} || true
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/3* || true
          sudo docker system prune -af || true
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Do NOT install obsolete SDK package "tools" (fails: Failed to find package 'tools').
      # Expo 57 / RN 0.86 defaults: compileSdk 36, build-tools 36.0.0, NDK 27.1.12297006.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools cmdline-tools;latest build-tools;36.0.0 platforms;android-36 ndk;27.1.12297006 cmake;3.22.1

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        env:
          CI: "1"
        run: npx expo prebuild --platform android

      # Device APK only — skip x86/armeabi-v7a native compiles (disk + time on GHA).
      - name: Limit native ABIs for CI
        run: |
          set -euo pipefail
          PROP=android/gradle.properties
          if grep -q '^reactNativeArchitectures=' "$PROP"; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' "$PROP"
          else
            printf '\nreactNativeArchitectures=arm64-v8a\n' >> "$PROP"
          fi
          grep '^reactNativeArchitectures=' "$PROP"
          which node
          node -v
          df -h

      # Critical: assembleDebug skips embedding the JS bundle, so a sideloaded APK
      # waits for Metro forever and stays on the Expo splash. Always ship a release
      # build (debug-signed when no upload keystore) so index.android.bundle is inside.
      - name: Force release signing + embed JS
        run: |
          set -euo pipefail
          python3 scripts/patch-android-ci-gradle.py

      - name: Assemble APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Belt-and-suspenders with gradle.properties — Metaspace OOM shows up on RMI idle threads.
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false
          JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=1g
        run: |
          set -euo pipefail
          # Always assembleRelease so Metro is not required on device.
          # --no-parallel / max-workers: cut Kotlin+AGP Metaspace pressure on 7GB runners.
          GRADLE_ARGS=(assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --no-parallel --max-workers=2 --stacktrace)
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Release signing secrets present — configuring upload keystore."
            mkdir -p keystores
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystores/release.keystore
            {
              echo "MYAPP_UPLOAD_STORE_FILE=../keystores/release.keystore"
              echo "MYAPP_UPLOAD_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
              echo "MYAPP_UPLOAD_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
              echo "MYAPP_UPLOAD_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
            } >> gradle.properties
          else
            echo "No ANDROID_KEYSTORE_* secrets — release APK will use debug signing (OK for internal testing)."
          fi
          ./gradlew "${GRADLE_ARGS[@]}"

      - name: Locate APK and verify JS bundle
        id: apk
        run: |
          set -euo pipefail
          APK=$(find android -name "*.apk" -type f ! -name "*unaligned*" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under android/"
            find android -type f -name "*.apk" -o -name "*.aab" || true
            exit 1
          fi
          echo "Found APK: $APK"
          ls -lh "$APK"
          # Fail the job if the JS bundle is missing (would hang on Expo splash).
          if ! unzip -l "$APK" | grep -Eiq 'index\.android\.bundle|android\.bundle|\.hbc'; then
            echo "::error::APK has no embedded JS bundle — device would stick on splash without Metro."
            unzip -l "$APK" | head -80
            exit 1
          fi
          echo "JS bundle present in APK."
          unzip -l "$APK" | grep -Ei 'index\.android\.bundle|android\.bundle|\.hbc|splash' || true
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zakura-bot-android-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
