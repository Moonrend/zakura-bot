name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        type: choice
        options:
          - android
          - ios
          - all
        default: android
      profile:
        description: EAS build profile
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
  push:
    tags:
      - "v*"

jobs:
  eas-build:
    runs-on: ubuntu-latest
    steps:
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add a Expo access token at Settings → Secrets and variables → Actions → EXPO_TOKEN (create at https://expo.dev/settings/access-tokens)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Resolve platform and profile
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLATFORM="${{ inputs.platform }}"
            PROFILE="${{ inputs.profile }}"
          else
            # Tag pushes default to preview Android+iOS
            PLATFORM="all"
            PROFILE="preview"
          fi
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: EAS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --non-interactive \
            --platform "${{ steps.meta.outputs.platform }}" \
            --profile "${{ steps.meta.outputs.profile }}"
